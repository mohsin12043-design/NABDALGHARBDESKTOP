name: Build Desktop v2.2.5 Invoice Links

on:
  push:
    branches: [ fix/desktop-invoice-customer-links-v225 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve the existing desktop fixes
        run: node .github/scripts/bootstrap-desktop-v224.cjs
      - name: Preserve newest-first invoice history
        run: pwsh -File .github/scripts/fix-tax-invoice-history-sort.ps1
      - name: Apply invoice customer links
        run: node .github/scripts/apply-invoice-links-v225.cjs
      - name: Validate invoice and ledger behavior
        run: node .github/scripts/test-invoice-links-v225.cjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop build dependencies
        run: npm install
      - name: Build Windows installers
        run: npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: NabdAlGharb-Desktop-v2.2.5-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
