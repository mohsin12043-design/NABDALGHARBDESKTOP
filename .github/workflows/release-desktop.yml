name: Release Nabd Al-Gharb Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v2.0.0'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        shell: pwsh
        run: |
          if (-not "${{ env.RELEASE_TAG }}".StartsWith("v")) {
            throw "Release tag must start with v, for example v2.0.0"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") { Remove-Item "package-lock.json" -Force }
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Nabd Al-Gharb ${{ env.RELEASE_TAG }}"
          releaseBody: "Vehicle Stock and Mini Store combined desktop update."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
