<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Control Report</title><style>
:root{--navy:#1a2b6b;--gold:#c8941f;--bg:#eef0f5;--line:#d7dbe6}*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial,sans-serif;background:var(--bg);color:#202534}.wrap{max-width:1550px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.back{color:var(--navy);font-weight:800;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#f7f8fb;border-radius:10px;padding:12px}.metric b{display:block;font-size:21px;color:var(--navy);margin-top:5px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:block;font-size:12px;font-weight:800;color:#5b6373;margin-bottom:5px}input,select{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff}.gold{background:var(--gold)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eceef3;text-align:left}th{background:#f5f6fa;position:sticky;top:0}.num{text-align:right}.tablewrap{overflow:auto;max-height:58vh}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e7eaf3;font-size:11px;font-weight:700}.warn{color:#9e7415}.err{color:#b3261e}.ok{color:#1f7a3d}@media print{.noprint{display:none!important}body{background:#fff;padding:0}.card{border:0}}
</style></head><body><div class="wrap"><div class="top noprint"><div><a href="#" class="back" id="homeLink">‹ Home</a><h1 style="color:var(--navy);margin:10px 0 2px">Central Stock Control Report</h1><div>Admin view for Main Warehouse, Vehicle and Mini Store movements</div></div><div><button class="btn gold" onclick="window.print()">Print / Save PDF</button></div></div>
<div class="card noprint"><div class="filters"><div><label>From Date</label><input id="from" type="date"></div><div><label>To Date</label><input id="to" type="date"></div><div><label>Location Type</label><select id="loc"><option value="all">All Locations</option><option value="vehicle">Vehicle</option><option value="mini">Mini Store</option></select></div><div><label>Movement</label><select id="type"><option value="all">All Movements</option><option value="issue">Issued</option><option value="sale">Sold</option><option value="return">Returned</option><option value="damage">Damaged</option><option value="missing">Missing</option></select></div><button class="btn" id="refresh">Refresh Report</button></div></div>
<div class="card"><div class="grid" id="summary"></div></div>
<div class="card"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Location Type</th><th>Location</th><th>Reference</th><th>Product</th><th class="num">Quantity</th><th>Movement</th><th class="num">Amount</th><th>User</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>(function(){'use strict';function $(x){return document.getElementById(x)}function j(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function n(v){v=Number(v);return isFinite(v)?v:0}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}function dateOf(x){return String(x.ts||x.date||x.created_at||x.invoice_date||'').slice(0,10)}function rows(){var out=[];var vt=j('nag_stock_transfers_v1',[]);vt.forEach(function(x){out.push({date:dateOf(x),locType:'vehicle',loc:x.vehicle_name||x.destination||'',ref:x.reference||x.invoice_no||x.id||'',product:x.product_name||x.code||'',qty:n(x.qty),type:x.type||'issue',amount:n(x.amount),user:x.user_name||x.user_u||''})});var vs=j('nag_vehicle_sales_v1',[]);vs.forEach(function(x){var items=x.items||x.products||[];if(!items.length)items=[x];items.forEach(function(i){out.push({date:dateOf(x),locType:'vehicle',loc:x.vehicle_name||'',ref:x.invoice_no||x.reference||'',product:i.name||i.product_name||i.code||'',qty:n(i.qty||i.quantity),type:'sale',amount:n(i.total||i.amount||(n(i.qty||i.quantity)*n(i.price))),user:x.cashier_name||x.user_name||''})})});var mt=j('nag_mini_store_transfers_v1',[]);mt.forEach(function(x){out.push({date:dateOf(x),locType:'mini',loc:x.miniStore_name||x.mini_store_name||x.destination||'',ref:x.reference||x.invoice_no||x.id||'',product:x.product_name||x.code||'',qty:n(x.qty),type:x.type||'issue',amount:n(x.amount),user:x.user_name||x.user_u||''})});var ms=j('nag_mini_store_sales_v1',[]);ms.forEach(function(x){var items=x.items||x.products||[];if(!items.length)items=[x];items.forEach(function(i){out.push({date:dateOf(x),locType:'mini',loc:x.miniStore_name||x.mini_store_name||'',ref:x.invoice_no||x.reference||'',product:i.name||i.product_name||i.code||'',qty:n(i.qty||i.quantity),type:'sale',amount:n(i.total||i.amount||(n(i.qty||i.quantity)*n(i.price))),user:x.cashier_name||x.user_name||''})})});return out.sort(function(a,b){return String(b.date).localeCompare(String(a.date))})}function render(){var f=$('from').value,t=$('to').value,l=$('loc').value,ty=$('type').value;var all=rows().filter(function(x){return(!f||x.date>=f)&&(!t||x.date<=t)&&(l==='all'||x.locType===l)&&(ty==='all'||x.type===ty)});var totals={issue:0,sale:0,return:0,damage:0,missing:0,amount:0};all.forEach(function(x){if(totals[x.type]!=null)totals[x.type]+=x.qty;totals.amount+=x.amount});$('summary').innerHTML=[['Issued Qty',totals.issue],['Sold Qty',totals.sale],['Returned Qty',totals.return],['Damaged Qty',totals.damage],['Missing Qty',totals.missing],['Sales Value',totals.amount.toFixed(2)+' SAR']].map(function(x){return'<div class="metric">'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');$('rows').innerHTML=all.length?all.map(function(x){return'<tr><td>'+esc(x.date)+'</td><td><span class="pill">'+esc(x.locType==='mini'?'Mini Store':'Vehicle')+'</span></td><td>'+esc(x.loc)+'</td><td>'+esc(x.ref)+'</td><td>'+esc(x.product)+'</td><td class="num">'+esc(x.qty)+'</td><td>'+esc(x.type)+'</td><td class="num">'+esc(x.amount.toFixed(2))+'</td><td>'+esc(x.user)+'</td></tr>'}).join(''):'<tr><td colspan="9" style="text-align:center;padding:30px">No matching records found.</td></tr>'} $('refresh').onclick=render;$('homeLink').onclick=function(e){e.preventDefault();parent.postMessage('home','*')};window.addEventListener('storage',render);render()})();</script></body></html>
