<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Assigned Inventory</title>
<style>
:root{--navy:#1a2b6b;--gold:#C8941F;--bg:#eef0f5;--line:#d7dbe6}*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial,sans-serif;background:var(--bg);color:#202534}.wrap{max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.back{color:var(--navy);font-weight:800;text-decoration:none}.refresh{border:0;background:transparent;color:var(--navy);font-weight:800;cursor:pointer;padding:8px}.title{margin:14px 0 2px;color:var(--navy);font-size:26px}.sub{color:#777;font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.location{min-width:230px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}.metric{background:#f5f6fa;border-radius:10px;padding:12px;color:#5b6373}.metric b{display:block;color:var(--navy);font-size:20px;margin-top:4px}.tablewrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px;border-bottom:1px solid #eceef3;text-align:left;white-space:nowrap}th{background:#f5f6fa;color:#445;position:sticky;top:0}.num{text-align:right}.empty{text-align:center;color:#888;padding:28px}.cashier{position:fixed;right:10px;bottom:10px;background:var(--navy);color:#fff;border:1px solid var(--gold);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.18)}.notice{margin-top:12px;padding:10px;border-radius:8px;background:#fff4e0;color:#8a6411;display:none}@media(max-width:680px){body{padding:10px}.title{font-size:22px}th,td{padding:9px;font-size:12px}}
</style></head><body><div class="wrap"><div class="top"><a href="#" class="back" id="homeLink">‹ Home</a><button class="refresh" id="refreshBtn">Refresh</button></div><h1 class="title" id="title">My Inventory</h1><div class="sub" id="subtitle">Only stock assigned to you is shown</div><div class="card"><div class="cardhead"><h3 id="cardTitle" style="margin:0;color:var(--navy)">Current Inventory</h3><select id="locationSelect" class="location"></select></div><div class="notice" id="notice"></div><div class="summary" id="summary"></div><div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div></div></div><div class="cashier" id="cashierBadge"></div>
<script>
(function(){'use strict';
var CTX=__NAG_CONTEXT__;
function p(v,fb){try{return v?JSON.parse(v):fb}catch(e){return fb}}
function ls(k){try{return parent.localStorage.getItem(k)}catch(e){try{return localStorage.getItem(k)}catch(_){return null}}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n(v){v=Number(v);return isFinite(v)?v:0} function money(v){return n(v).toFixed(2)}
function norm(v){return String(v==null?'':v).trim().toLowerCase()}
function assignedTo(row){var candidates=[row&&row.cashier_u,row&&row.cashier_username,row&&row.assigned_to,row&&row.cashier,row&&row.user_u];for(var i=0;i<candidates.length;i++){if(norm(candidates[i])===norm(CTX.uid))return true}return false}
function products(){var a=p(ls('nag_products_v1'),[]);return Array.isArray(a)?a:[]}
function productCode(x){return String(x&&x.code||'')} function productName(x){return String(x&&(x.name_en||x.en||x.name||x.code)||'')}
function wholesale(x){var wm=p(ls('nag_product_wholesale_prices_v1'),{});var c=productCode(x);return n(x&&x.wholesale_price!=null?x.wholesale_price:(wm[c]!=null?wm[c]:(x&&x.sale_price!=null?x.sale_price:0)))}
function retail(x){x=x||{};return n(x.sale_price!=null?x.sale_price:(x.retail_price!=null?x.retail_price:(x.retailPrice!=null?x.retailPrice:(x.selling_price!=null?x.selling_price:(x.sell_price!=null?x.sell_price:x.price)))))}
function users(){var a=p(ls('nag_users'),[]);return Array.isArray(a)?a:[]} function currentUser(){return users().find(function(u){return norm(u.u)===norm(CTX.uid)})||{}}
function locationConfig(){if(CTX.kind==='mini'){return {label:'Mini Store',title:'My Mini Store Inventory',subtitle:'Only products currently available in my assigned Mini Store',card:'Current Mini Store Inventory',locations:'nag_mini_stores_v1',inventory:'nag_mini_store_inventory_v1',prices:'nag_mini_store_prices_v1'}}return {label:'Vehicle',title:'My Vehicle Inventory',subtitle:'Only products currently available in my assigned vehicle',card:'Current Vehicle Inventory',locations:'nag_vehicles_v1',inventory:'nag_location_inventory_v1',prices:'nag_vehicle_prices_v1'}}
function locations(){var c=locationConfig(),a=p(ls(c.locations),[]);if(!Array.isArray(a))a=[];return a.filter(assignedTo)}
function pricePermission(locationId){if(CTX.kind==='mini'){var all=p(ls('nag_mini_store_price_permissions_v1'),{}),x=all[locationId]||{};return {location:x.show_mini_price!==false,retail:!!x.show_retail_price,wholesale:!!x.show_wholesale_price,value:!!x.show_stock_value}}var u=currentUser(),access=String(u.priceAccess||'retail');return {location:true,retail:access==='retail'||access==='both',wholesale:access==='wholesale'||access==='both'||!!u.allowCostPrice,value:true}}
function renderLocations(){var c=locationConfig(),list=locations(),sel=document.getElementById('locationSelect');document.getElementById('title').textContent=c.title;document.getElementById('subtitle').textContent=c.subtitle;document.getElementById('cardTitle').textContent=c.card;document.getElementById('cashierBadge').textContent='Cashier view: '+(CTX.name||CTX.uid)+' only';if(!list.length){sel.innerHTML='<option value="">No assigned '+esc(c.label)+'</option>';showNotice('No '+c.label+' is assigned to this cashier. Ask Admin to assign one.');renderInventory();return}sel.innerHTML=list.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.name||x.id)+'</option>'}).join('');hideNotice();renderInventory()}
function showNotice(t){var el=document.getElementById('notice');el.textContent=t;el.style.display='block'}function hideNotice(){document.getElementById('notice').style.display='none'}
function renderInventory(){var c=locationConfig(),id=document.getElementById('locationSelect').value,inv=p(ls(c.inventory),{}),stock=inv&&inv[id]||{},ps=products(),pm={};ps.forEach(function(x){pm[productCode(x)]=x});var prices=p(ls(c.prices),{}),perm=pricePermission(id),list=Object.keys(stock||{}).filter(function(code){return n(stock[code])>0}).map(function(code){var prod=pm[code]||{code:code,name_en:code},q=n(stock[code]),rp=retail(prod),lp=n(prices[code]);if(CTX.kind==='mini'&&lp<=0)lp=rp>0?rp:wholesale(prod);var wp=wholesale(prod),unitPrice=CTX.kind==='mini'?(rp>0?rp:lp):lp,unitVat=unitPrice*0.15,unitWithVat=unitPrice+unitVat,totalBeforeVat=q*unitPrice,totalVat=q*unitVat,grandTotal=q*unitWithVat;return {code:code,prod:prod,q:q,lp:lp,rp:rp,wp:wp,unitPrice:unitPrice,unitVat:unitVat,unitWithVat:unitWithVat,totalBeforeVat:totalBeforeVat,totalVat:totalVat,grandTotal:grandTotal}});var qty=list.reduce(function(a,x){return a+x.q},0),value=list.reduce(function(a,x){return a+x.q*x.lp},0),summary='<div class="metric">Products<b>'+list.length+'</b></div><div class="metric">Total Quantity<b>'+money(qty)+'</b></div>';if(CTX.kind==='mini'){var totalBeforeVat=list.reduce(function(a,x){return a+x.totalBeforeVat},0),totalVat=list.reduce(function(a,x){return a+x.totalVat},0),grandTotal=list.reduce(function(a,x){return a+x.grandTotal},0);summary+='<div class="metric">Stock Value Before VAT<b>'+money(totalBeforeVat)+' SAR</b></div><div class="metric">Total VAT 15%<b>'+money(totalVat)+' SAR</b></div><div class="metric">Grand Total With VAT<b>'+money(grandTotal)+' SAR</b></div>';document.getElementById('summary').innerHTML=summary;document.getElementById('head').innerHTML='<th>Code</th><th>Product</th><th class="num">Quantity</th><th class="num">Retail Price</th><th class="num">VAT 15%</th><th class="num">Price + VAT</th><th class="num">Total Price</th>';document.getElementById('rows').innerHTML=list.length?list.map(function(x){return '<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(productName(x.prod))+'</td><td class="num">'+money(x.q)+'</td><td class="num">'+money(x.unitPrice)+' SAR</td><td class="num">'+money(x.unitVat)+' SAR</td><td class="num">'+money(x.unitWithVat)+' SAR</td><td class="num"><b>'+money(x.grandTotal)+' SAR</b></td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No stock currently available in this Mini Store.</td></tr>';return}var vehicleBeforeVat=list.reduce(function(a,x){return a+x.q*x.wp},0),vehicleVat=list.reduce(function(a,x){return a+(x.q*x.wp*0.15)},0),vehicleGrandTotal=vehicleBeforeVat+vehicleVat;summary+='<div class="metric">Stock Value Before VAT<b>'+money(vehicleBeforeVat)+' SAR</b></div><div class="metric">Total VAT 15%<b>'+money(vehicleVat)+' SAR</b></div><div class="metric">Grand Total With VAT<b>'+money(vehicleGrandTotal)+' SAR</b></div>';document.getElementById('summary').innerHTML=summary;document.getElementById('head').innerHTML='<th>Code</th><th>Product</th><th class="num">Quantity</th><th class="num">Wholesale Price</th><th class="num">VAT 15%</th><th class="num">Price + VAT</th><th class="num">Total Price</th>';document.getElementById('rows').innerHTML=list.length?list.map(function(x){var unitVat=x.wp*0.15,priceWithVat=x.wp+unitVat,totalPrice=x.q*priceWithVat;return '<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(productName(x.prod))+'</td><td class="num">'+money(x.q)+'</td><td class="num">'+money(x.wp)+' SAR</td><td class="num">'+money(unitVat)+' SAR</td><td class="num">'+money(priceWithVat)+' SAR</td><td class="num"><b>'+money(totalPrice)+' SAR</b></td></tr>'}).join(''):'<tr><td colspan="7" class="empty">No stock currently available in this Vehicle.</td></tr>'}
document.getElementById('homeLink').onclick=function(e){e.preventDefault();parent.postMessage('home','*')};document.getElementById('refreshBtn').onclick=renderLocations;document.getElementById('locationSelect').onchange=renderInventory;window.addEventListener('storage',renderLocations);renderLocations();
})();
</script></body></html>
